 <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>aspvp.club -- INDIAN PvP Tiers</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #12141c;
      --surface:   #1a1d2b;
      --surface2:  #21253a;
      --surface3:  #272b3e;
      --border:    rgba(255,255,255,0.07);
      --border2:   rgba(255,255,255,0.13);
      --text:      #e8ecff;
      --muted:     #6b738f;
      --gold:      #f5c842;
      --silver:    #b0bcd4;
      --bronze:    #c87840;
      --rank1-bg:  #c8960a;
      --rank2-bg:  #5a7090;
      --rank3-bg:  #8c6030;
      --blue:      #5b8dee;
      --green:     #3cde7e;
      --red:       #e05050;
      --mono:      'Space Mono', monospace;
      --sans:      'Inter', system-ui, sans-serif;
      --radius:    12px;
      --radius-lg: 18px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      min-height: 100vh;
    }

    /* ─── HEADER ─── */
    .site-header {
      background: #0e1018;
      border-bottom: 1px solid var(--border);
      padding: 0 1rem;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-inner {
      max-width: 860px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      gap: 12px;
      height: 56px;
    }

    .logo {
      font-size: 22px;
      font-weight: 900;
      letter-spacing: -0.04em;
      line-height: 1;
      flex-shrink: 0;
    }

    .logo span:nth-child(1) { color: #6ec94f; }
    .logo span:nth-child(2) { color: #4fa8e0; }
    .logo span:nth-child(3) { color: #e05050; }
    .logo span:nth-child(4) { color: #e8a030; }
    .logo span:nth-child(5) { color: #d0d8f0; }
    .logo span:nth-child(6) { color: #d0d8f0; }
    .logo span:nth-child(7) { color: #5b8dee; }

    .search-wrap {
      flex: 1;
      position: relative;
    }

    .search-wrap svg {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      width: 16px; height: 16px;
      color: var(--muted);
      pointer-events: none;
    }

    .search-input {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border2);
      border-radius: 999px;
      padding: 8px 16px 8px 36px;
      font-family: var(--sans);
      font-size: 13px;
      color: var(--text);
      outline: none;
      transition: border-color 0.15s;
    }

    .search-input::placeholder { color: var(--muted); }
    .search-input:focus { border-color: rgba(91,141,238,0.5); }

    .hamburger {
      width: 36px; height: 36px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      flex-shrink: 0;
    }

    .hamburger span {
      display: block;
      width: 20px; height: 2px;
      background: var(--muted);
      border-radius: 2px;
    }

    /* ─── TABS ─── */
    .tabs-wrap {
      background: #0e1018;
      border-bottom: 1px solid var(--border);
      padding: 0 1rem;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .tabs-wrap::-webkit-scrollbar { display: none; }

    .tabs-inner {
      max-width: 860px;
      margin: 0 auto;
      display: flex;
      gap: 4px;
    }

    .tab {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      padding: 10px 20px;
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      cursor: pointer;
      border-bottom: 2px solid transparent;
      white-space: nowrap;
      transition: color 0.15s;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .tab svg, .tab .tab-icon { font-size: 18px; }

    .tab.active {
      color: #fff;
      border-bottom-color: var(--gold);
    }

    .tab-icon { font-size: 20px; }

    /* ─── SERVER BANNER ─── */
    .server-banner {
      max-width: 860px;
      margin: 0 auto;
      padding: 12px 1rem;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .info-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--surface2);
      border: 1px solid var(--border2);
      border-radius: 999px;
      padding: 6px 14px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text);
      cursor: pointer;
    }

    .info-btn svg { width: 14px; height: 14px; color: var(--blue); }

    .server-ip-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-left: auto;
    }

    .pvp-badge {
      background: #c0392b;
      color: #fff;
      font-size: 11px;
      font-weight: 800;
      padding: 4px 8px;
      border-radius: 6px;
      letter-spacing: 0.04em;
    }

    .server-ip-label {
      font-size: 10px;
      font-weight: 700;
      color: var(--muted);
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .server-ip-val {
      font-family: var(--mono);
      font-size: 12px;
      font-weight: 700;
      color: var(--text);
      background: var(--surface2);
      border: 1px solid var(--border2);
      border-radius: 8px;
      padding: 4px 10px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .discord-btn {
      background: #5865F2;
      border-radius: 8px;
      width: 28px; height: 28px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
    }

    .discord-btn svg { width: 16px; height: 16px; fill: #fff; }

    /* ─── TABLE HEADER ─── */
    .table-header {
      max-width: 860px;
      margin: 0 auto;
      padding: 4px 1rem 8px;
      display: grid;
      grid-template-columns: 60px 1fr 90px;
      font-size: 10px;
      font-weight: 700;
      color: var(--muted);
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    /* ─── PLAYER CARD ─── */
    .cards-wrap {
      max-width: 860px;
      margin: 0 auto;
      padding: 0 1rem 5rem;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .player-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      overflow: hidden;
      transition: border-color 0.15s;
    }

    .player-card:hover { border-color: var(--border2); }

    .card-top {
      display: grid;
      grid-template-columns: 130px 1fr 90px;
      align-items: stretch;
      min-height: 80px;
    }

    /* rank + skin panel */
    .card-left {
      display: flex;
      align-items: center;
      position: relative;
      border-radius: var(--radius-lg) 0 0 0;
      overflow: hidden;
    }

    .card-left.rank-1 { background: linear-gradient(135deg, #c8960a 0%, #8a5e00 100%); }
    .card-left.rank-2 { background: linear-gradient(135deg, #4a6070 0%, #2a3a4a 100%); }
    .card-left.rank-3 { background: linear-gradient(135deg, #8c5820 0%, #5a3010 100%); }
    .card-left.rank-other { background: linear-gradient(135deg, #1e2230 0%, #161824 100%); }

    .rank-number {
      font-size: 28px;
      font-weight: 900;
      color: rgba(255,255,255,0.85);
      padding: 0 0 0 16px;
      line-height: 1;
      font-style: italic;
      flex-shrink: 0;
      min-width: 52px;
    }

    .skin-img {
      width: 58px;
      height: 78px;
      object-fit: cover;
      object-position: top;
      border-radius: 4px;
      margin: 0 8px 0 4px;
      image-rendering: pixelated;
      align-self: flex-end;
    }

    .skin-placeholder {
      width: 58px;
      height: 78px;
      border-radius: 4px;
      margin: 0 8px 0 4px;
      align-self: flex-end;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      font-weight: 900;
      color: rgba(255,255,255,0.4);
      background: rgba(0,0,0,0.2);
      font-family: var(--mono);
      flex-shrink: 0;
    }

    /* main info */
    .card-info {
      padding: 14px 12px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .card-name {
      font-size: 22px;
      font-weight: 800;
      color: #fff;
      letter-spacing: -0.02em;
      line-height: 1.1;
    }

    .card-tier {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 4px;
    }

    .tier-icon {
      width: 20px; height: 20px;
    }

    .tier-text {
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
    }

    .tier-pts {
      font-family: var(--mono);
      font-size: 12px;
      color: var(--muted);
    }

    /* region */
    .card-region {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px 10px;
    }

    .region-badge {
      font-size: 13px;
      font-weight: 800;
      padding: 6px 14px;
      border-radius: 8px;
      letter-spacing: 0.06em;
    }

    .region-badge.NA { background: #7b1a1a; color: #ff8080; }
    .region-badge.EU { background: #1a4a1a; color: #60d060; }

    /* ─── TIERS SECTION ─── */
    .card-tiers {
      border-top: 1px solid var(--border);
      padding: 10px 14px 12px;
    }

    .tiers-label {
      font-size: 10px;
      font-weight: 700;
      color: var(--muted);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .tiers-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .tier-badge {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
    }

    .tier-badge-icon {
      width: 36px; height: 36px;
      border-radius: 50%;
      background: #0e1018;
      border: 2px solid rgba(255,255,255,0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }

    .tier-badge-label {
      font-family: var(--mono);
      font-size: 9px;
      font-weight: 700;
      border-radius: 4px;
      padding: 1px 4px;
    }

    .tier-badge-label.ht1 { background: #c8960a; color: #fff8e0; }
    .tier-badge-label.ht2 { background: #8a6000; color: #ffe090; }
    .tier-badge-label.ht3 { background: #5a3e00; color: #ffd060; }
    .tier-badge-label.lt1 { background: #1a3a5a; color: #80c0ff; }
    .tier-badge-label.lt2 { background: #102838; color: #60a0e0; }
    .tier-badge-label.lt3 { background: #0a1a28; color: #4080c0; }

    /* ─── FOOTER ─── */
    footer {
      border-top: 1px solid var(--border);
      padding: 1.5rem 1rem;
      text-align: center;
      font-family: var(--mono);
      font-size: 11px;
      color: var(--muted);
    }

    footer span { color: var(--text); }

    @media (max-width: 500px) {
      .card-top { grid-template-columns: 110px 1fr 70px; }
      .rank-number { font-size: 22px; min-width: 40px; padding-left: 10px; }
      .skin-placeholder, .skin-img { width: 46px; height: 62px; }
      .card-name { font-size: 17px; }
      .tier-badge-icon { width: 30px; height: 30px; font-size: 13px; }
    }
  </style>
</head>

    const emojiMap = {
    MACE:   "https://cdn.discordapp.com/emojis/1513812703418777662.png",
    POT:    "https://cdn.discordapp.com/emojis/1504055524209987614.png",
    SMP:    "https://cdn.discordapp.com/emojis/1513812687757250620.png",
    SWORD:  "https://cdn.discordapp.com/emojis/1512168702362255380.png",
    UHC:    "https://cdn.discordapp.com/emojis/1506273397095530636.png",
    AXE:    "https://cdn.discordapp.com/emojis/1500454383681273986.png",
    NETHOP: "https://cdn.discordapp.com/emojis/1513812670636359751.png", 
    CRYSTAL: "https://cdn.discordapp.com/emojis/1513806483186516128.png",
  };

  // In-memory state
  let allPlayers = [];
  let lastUpdated = null;
  let refreshTimer = null;

  // ─── HELPERS ───────────────────────────────────────────────────────────────
  function leftClass(rank) {
    if (rank === 1) return 'card-left rank-1';
    if (rank === 2) return 'card-left rank-2';
    if (rank === 3) return 'card-left rank-3';
    return 'card-left rank-other';
  }

  function tierLabelClass(label) {
    const l = label.toLowerCase();
    if (l === 'ht1') return 'ht1';
    if (l === 'ht2') return 'ht2';
    if (l === 'ht3') return 'ht3';
    if (l === 'lt1') return 'lt1';
    if (l === 'lt2') return 'lt2';
    return 'lt3';
  }

  // Validate a single player object coming from the API
  function isValidPlayer(p) {
    return (
      p &&
      typeof p.rank === 'number' &&
      typeof p.name === 'string' && p.name.trim() !== '' &&
      typeof p.points === 'number' &&
      typeof p.tier === 'string' &&
      typeof p.region === 'string' &&
      Array.isArray(p.tiers)
    );
  }

  // ─── RENDER ────────────────────────────────────────────────────────────────
  function renderCard(p) {
    const tiersHTML = (p.tiers || []).map(t => `
      <div class="tier-badge">
        <div class="tier-badge-icon"><img src="${t.image || emojiMap[t.icon] || ''}" alt="${t.icon || ''}" width="22" height="22" style="image-rendering:auto;object-fit:contain;"></div>
        <div class="tier-badge-label ${tierLabelClass(t.label || '')}">${t.label || ''}</div>
      </div>
    `).join('');

    return `
      <div class="player-card" data-name="${p.name.toLowerCase()}">
        <div class="card-top">
          <div class="${leftClass(p.rank)}">
            <div class="rank-number">${p.rank}.</div>
            <img
              class="skin-img"
              src="${CUSTOM_SKINS[p.name] || 'https://crafatar.com/renders/body/' + encodeURIComponent(p.name) + '?overlay&scale=3'}"
              onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';"
              alt="${p.name} skin"
            >
            <div class="skin-placeholder" style="display:none">${p.name.slice(0,2).toUpperCase()}</div>
          </div>
          <div class="card-info">
            <div class="card-name">${p.name}</div>
            <div class="card-tier">
              <svg class="tier-icon" viewBox="0 0 24 24" fill="none" stroke="${p.tier === 'Combat Master' ? '#f5c842' : '#5b8dee'}" stroke-width="2">
                ${p.tier === 'Combat Master'
                  ? '<path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>'
                  : '<polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>'}
              </svg>
              <span class="tier-text">${p.tier}</span>
              <span class="tier-pts">(${p.points} pts)</span>
            </div>
          </div>
          <div class="card-region">
            <div class="region-badge ${p.region}">${p.region}</div>
          </div>
        </div>
        <div class="card-tiers">
          <div class="tiers-label">Tiers</div>
          <div class="tiers-row">${tiersHTML}</div>
        </div>
      </div>
    `;
  }

  function renderBoard(list) {
    const board = document.getElementById('board');
    if (!list || list.length === 0) {
      board.innerHTML = '<p style="text-align:center;color:var(--muted);padding:3rem 1rem;">No players found.</p>';
      return;
    }
    board.innerHTML = list.map(renderCard).join('');
  }

  function showLoadingState() {
    document.getElementById('board').innerHTML = `
      <p style="text-align:center;color:var(--muted);padding:3rem 1rem;">Loading players...</p>
    `;
  }

  function showErrorState(message) {
    document.getElementById('board').innerHTML = `
      <p style="text-align:center;color:var(--red);padding:3rem 1rem;">
        ⚠️ ${message}<br>
        <span style="font-size:12px;color:var(--muted);">Showing last known data.</span>
      </p>
    `;
  }

  function updateTimestamp(fromAPI) {
    lastUpdated = new Date();
    const el = document.getElementById('ts');
    const source = fromAPI ? '🟢 Live' : '🟡 Local data';
    el.textContent = source + ' · Updated ' + lastUpdated.toLocaleTimeString('en-US', { hour:'2-digit', minute:'2-digit', second:'2-digit' });
  }

  // ─── SEARCH ────────────────────────────────────────────────────────────────
  function filterPlayers() {
    const q = document.getElementById('searchInput').value.toLowerCase().trim();
    const filtered = allPlayers.filter(p => p.name.toLowerCase().includes(q));
    renderBoard(filtered);
  }

  // ─── DATA LOADING ──────────────────────────────────────────────────────────
  async function fetchFromAPI() {
    const res = await fetch(API_URL, { cache: 'no-store' });
    if (!res.ok) throw new Error(`Server returned ${res.status}`);
    const data = await res.json();

    // Accept both { players: [...] } and plain array
    const list = Array.isArray(data) ? data : (Array.isArray(data.players) ? data.players : null);
    if (!list) throw new Error('Unexpected API response format');

    // Filter out any malformed player objects
    const valid = list.filter(isValidPlayer);
    if (valid.length === 0) throw new Error('API returned no valid players');

    return valid;
  }

  async function loadPlayers(isRefresh = false) {
    if (!isRefresh) showLoadingState();

    // No API configured yet -- use fallback
    if (!API_URL) {
      allPlayers = FALLBACK_PLAYERS;
      renderBoard(allPlayers);
      updateTimestamp(false);
      return;
    }

    try {
      const players = await fetchFromAPI();
      allPlayers = players;
      renderBoard(allPlayers);
      updateTimestamp(true);
    } catch (err) {
      console.error('[Leaderboard] Failed to fetch players:', err);

      // On first load with no data yet, fall back to local data
      if (allPlayers.length === 0) {
        allPlayers = FALLBACK_PLAYERS;
        renderBoard(allPlayers);
      } else {
        // Keep existing data on screen, show error notice
        showErrorState('Could not reach the server.');
        setTimeout(() => renderBoard(allPlayers), 3000);
      }
      updateTimestamp(false);
    }
  }

  function startAutoRefresh() {
    if (refreshTimer) clearInterval(refreshTimer);
    refreshTimer = setInterval(() => loadPlayers(true), REFRESH_INTERVAL);
  }

  // ─── INIT ──────────────────────────────────────────────────────────────────
  loadPlayers();
  startAutoRefresh();
</script>
